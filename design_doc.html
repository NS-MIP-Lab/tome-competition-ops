<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詳細設計書作成課題</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#d8dbe0;
    --text:#1f2328;
    --muted:#6b7280;
    --accent:#1f4e79;
    --accent-dark:#163a5a;
    --head:#1f4e79;
    --code-bg:#1e2430;
    --code-text:#e6e9ef;
    --code-gutter:#7c8798;
    --hint:#c62828;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Meiryo","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.7;
    overflow:hidden;
  }

  /* ===== レイアウト：左右2分割 ===== */
  #app{display:flex;height:100vh;width:100vw;}
  #left{
    width:50%;height:100vh;background:var(--code-bg);
    display:flex;flex-direction:column;
    overflow:hidden;                 /* 左ペインはスクロール不可 */
  }
  #right{
    width:50%;height:100vh;
    display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--border);
  }

  /* ===== 左：ソースコード（固定表示） ===== */
  #left-head{
    flex:0 0 auto;padding:10px 16px;color:#aeb7c4;
    font-size:13px;letter-spacing:.04em;border-bottom:1px solid #2c3442;
  }
  #left-head strong{color:#e6e9ef;font-size:14px;font-weight:600;}
  #code-wrap{flex:1 1 auto;overflow:hidden;padding:12px 16px 16px;display:flex;position:relative;}
  /* 開始前はソースコードを隠す */
  #code-mask{
    position:absolute;inset:0;background:var(--code-bg);
    display:flex;align-items:center;justify-content:center;
    color:#8b95a5;font-size:14px;text-align:center;line-height:2;
  }
  #code{
    font-family:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
    font-size:15px;line-height:1.55;color:var(--code-text);
    white-space:pre;width:100%;
    user-select:none;                /* 書き写し防止のため選択不可 */
  }
  #code .ln{
    display:inline-block;width:2.6em;text-align:right;
    margin-right:1.1em;color:var(--code-gutter);user-select:none;
  }

  /* ===== 右：設問エリア ===== */
  #right-head{
    flex:0 0 auto;padding:10px 24px;
    border-bottom:1px solid var(--border);background:#fbfbfc;
  }
  #step-counter{display:block;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;}
  #bar{height:4px;background:#e5e7eb;border-radius:2px;margin-top:8px;overflow:hidden;}
  #bar > div{height:100%;width:0;background:var(--accent);transition:width .25s ease;}

  #right-body{flex:1 1 auto;overflow-y:auto;padding:22px 24px 32px;}
  #right-foot{
    flex:0 0 auto;padding:12px 24px;border-top:1px solid var(--border);
    background:#fbfbfc;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  #save-state{
    font-size:12px;color:var(--muted);
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  h2.q-title{font-size:19px;margin:0 0 6px;font-weight:700;color:var(--head);}
  h3.q-sub{font-size:15px;margin:20px 0 8px;font-weight:700;color:var(--head);}
  p.q-desc{margin:0 0 16px;color:#374151;font-size:14px;}
  p.q-note{margin:16px 0 8px;font-size:14px;}

  /* ===== 表 ===== */
  table{border-collapse:collapse;width:100%;margin-bottom:14px;font-size:14px;table-layout:fixed;}
  th,td{border:1px solid var(--border);padding:0;vertical-align:middle;}
  th{background:var(--head);color:#fff;padding:8px 10px;font-weight:600;text-align:center;font-size:13px;}
  td.label{background:#f7f8fa;padding:8px 10px;font-weight:500;word-break:break-word;}
  td.center{text-align:center;}
  tr.example td{background:#eef1f5;color:#5b6472;text-align:center;font-size:13px;}
  td.cell{padding:0;}
  .cellwrap{display:flex;align-items:center;gap:4px;padding:6px 10px;font-size:14px;}
  .cellwrap .fixed{white-space:nowrap;color:#374151;}

  textarea{
    width:100%;border:none;outline:none;resize:none;padding:8px 10px;
    font-family:inherit;font-size:14px;line-height:1.6;background:transparent;color:inherit;
    overflow:hidden;display:block;
  }
  textarea:focus{background:#eff6ff;}
  textarea.free{border:1px solid var(--border);border-radius:6px;background:#fff;min-height:120px;}

  /* ===== 空欄（インライン入力） ===== */
  input.blank{
    font-family:inherit;font-size:14px;color:inherit;
    border:none;border-bottom:1.5px solid #9aa3af;background:#fff;
    padding:2px 6px;min-width:4em;text-align:center;outline:none;
  }
  input.blank:focus{background:#eff6ff;border-bottom-color:var(--accent);}

  /* ===== 穴埋め文 ===== */
  .fill{margin:0 0 12px;padding-left:14px;font-size:14px;line-height:2.4;}
  .fill .lead{font-weight:700;color:var(--accent);margin-right:2px;}

  /* ===== 選択肢 ===== */
  .choices{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle;}
  .choices label{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:5px;
    padding:3px 12px;background:#fff;cursor:pointer;font-size:14px;line-height:1.5;
  }
  .choices input{accent-color:var(--accent);margin:0;}
  .choices label:has(input:checked){border-color:var(--accent);background:#eaf1f8;}

  .btn{
    font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:6px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
    white-space:nowrap;          /* 幅が足りなくても文字を折り返さない */
    flex:0 0 auto;               /* ボタンは縮めない */
  }
  .btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.ghost{background:#fff;color:var(--accent);}
  .btn.ghost:hover{background:#eaf1f8;}
  .btn.hint{background:var(--hint);border-color:var(--hint);}
  .btn.hint:hover{background:#a91f1f;border-color:#a91f1f;}

  /* ===== ヒント要請の合図（数秒だけ表示して消える） =====
     実験員が視界の端で気づける程度に抑えている。
     被験者の目の前で強く光らせると、まさに計測したい瞬間に
     視覚刺激が入り、脳波や心拍に余計な反応が乗ってしまう */
  #hint-flash{
    position:fixed;inset:0;z-index:9999;
    display:none;align-items:center;justify-content:center;
    pointer-events:none;                    /* 表示中も入力を妨げない */
    opacity:0;transition:opacity .3s ease;
    background:rgba(198,40,40,.12);
    animation:hint-pulse 1.8s ease-in-out infinite;
  }
  #hint-flash.on{opacity:1;}
  @keyframes hint-pulse{
    0%,100%{background:rgba(198,40,40,.08);}
    50%    {background:rgba(198,40,40,.18);}
  }
  .hint-flash-inner{
    background:var(--hint);color:#fff;border-radius:10px;
    padding:18px 32px;text-align:center;
    font-size:22px;font-weight:700;line-height:1.5;
    box-shadow:0 6px 20px rgba(0,0,0,.22);
  }
  .hint-flash-inner span{display:block;margin-top:6px;font-size:13px;font-weight:600;opacity:.9;}

  /* ===== 前回データの警告（被験者の取り違え防止） ===== */
  .warn{
    border:2px solid var(--hint);background:#fdecec;border-radius:8px;
    padding:14px 16px;margin:0 0 20px;font-size:14px;
  }
  .warn b{display:block;color:#8e1c1c;font-size:15px;margin-bottom:4px;}
  .warn p{margin:0 0 10px;color:#8e1c1c;}
  .warn .btn{padding:7px 18px;font-size:14px;}

  /* ===== 未入力チェック ===== */
  #validation-msg{
    border:1.5px solid var(--hint);background:#fdecec;color:#8e1c1c;
    border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:14px;font-weight:600;
  }
  #validation-msg .msg-sub{display:block;margin-top:6px;font-weight:400;}
  .missing-tag{
    display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;
    background:var(--hint);color:#fff;font-size:11px;font-weight:700;
    white-space:nowrap;vertical-align:middle;
  }
  td.cell .missing-tag{margin:0 0 6px 10px;}
  textarea.free + .missing-tag{margin:6px 0 0;}
  textarea.missing{background:#fff5f5;box-shadow:inset 0 0 0 2px var(--hint);}
  input.blank.missing{
    background:#fff5f5;border-bottom-color:var(--hint);
    box-shadow:0 0 0 2px rgba(198,40,40,.18);
  }
  .meta-grid input.missing{background:#fff5f5;border-color:var(--hint);}
  .choices.missing{outline:2px solid var(--hint);outline-offset:3px;border-radius:6px;}

  /* ===== 理解度テスト =====
     右半分だけを覆う。左のソースコードは見たまま答えられ、
     自分が書いた設計書は完全に隠れる（不透明にしている） */
  #quiz-overlay{
    position:fixed;inset:0 0 0 50%;z-index:9998;padding:18px;
    display:none;align-items:center;justify-content:center;
    background:#141a22;
  }
  #quiz-overlay.on{display:flex;}
  .quiz-card{
    background:var(--panel);border-radius:14px;width:100%;max-width:780px;
    max-height:calc(100vh - 36px);overflow-y:auto;padding:28px 30px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .quiz-card h2{margin:0 0 4px;font-size:21px;color:var(--head);}
  .quiz-lead{margin:0 0 22px;font-size:14px;color:var(--muted);}
  #quiz-count{
    display:inline-block;margin-left:8px;padding:1px 10px;border-radius:99px;
    background:#eef1f5;color:var(--head);font-size:12px;font-weight:700;white-space:nowrap;
  }
  .quiz-item{margin-bottom:24px;}
  .quiz-q{margin:0 0 10px;font-size:15px;font-weight:700;}
  .quiz-q .no{color:var(--head);margin-right:8px;}
  .quiz-choices{display:grid;gap:8px;}
  .quiz-choices label{
    display:flex;align-items:flex-start;gap:10px;
    border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;background:#fff;cursor:pointer;font-size:14px;line-height:1.6;
  }
  .quiz-choices label:hover{background:#f7f9fc;}
  .quiz-choices label:has(input:checked){border-color:var(--accent);background:#eaf1f8;}
  .quiz-choices input{accent-color:var(--accent);margin-top:4px;}
  .quiz-item.missing .quiz-choices{outline:2px solid var(--hint);outline-offset:4px;border-radius:8px;}
  .quiz-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  #quiz-msg{
    border:1.5px solid var(--hint);background:#fdecec;color:#8e1c1c;
    border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:14px;font-weight:600;
  }

  /* フッターは、余りがあれば左の説明文に割り当て、足りなければ説明文を削る。
     ボタンは常に元の大きさを保つ */
  .foot-left{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;}
  .foot-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .linkbtn{
    font-family:inherit;font-size:12px;color:var(--accent);
    background:none;border:none;padding:0;text-decoration:underline;cursor:pointer;white-space:nowrap;
  }
  /* 完了画面のボタンは、収まらなければ折り返して縦に積む */
  .done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px;}

  .meta-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin-bottom:20px;}
  .meta-grid label{font-size:14px;font-weight:600;}
  .meta-field{display:flex;align-items:center;}
  .meta-grid input{
    font-family:inherit;font-size:14px;padding:7px 10px;
    border:1px solid var(--border);border-radius:6px;background:#fff;color:inherit;
  }
  .info{border:1px solid var(--border);border-radius:8px;background:#f7f8fa;padding:12px 16px;margin-bottom:20px;font-size:14px;}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;}
  .info dt{font-weight:600;}
  .info dd{margin:0;}
  ol.cautions{margin:0;padding-left:1.4em;font-size:14px;}
  ol.cautions li{margin-bottom:6px;}

  .scale-legend{font-size:13px;color:var(--muted);margin:8px 0 0;}
  .scale{margin-top:10px;}

  .done{text-align:center;padding:60px 20px;}
  .done h2{font-size:22px;margin:0 0 12px;color:var(--head);}
  .done p{color:var(--muted);}
  .recorder-box{border:1px solid var(--border);border-radius:8px;background:#f7f8fa;padding:12px 16px;margin-bottom:20px;}
  .recorder-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .recorder-status{font-size:13px;color:var(--muted);}
  .recorder-status.ok{color:#176b3a;font-weight:600;}
  .recorder-status.warn{color:#9a5b00;font-weight:600;}
  .recorder-status.error{color:var(--hint);font-weight:600;}
</style>
</head>
<body>
<div id="app">
  <!-- ================= 左：ソースコード（固定） ================= -->
  <section id="left">
    <div id="left-head"><strong>対象ソースコード</strong></div>
    <div id="code-wrap">
      <pre id="code"></pre>
      <div id="code-mask">「開始する」を押すと<br>ソースコードが表示されます</div>
    </div>
  </section>

  <!-- ================= 右：設計書（1問ずつ） ================= -->
  <section id="right">
    <div id="right-head">
      <span id="step-counter"></span>
      <div id="bar"><div></div></div>
    </div>
    <div id="right-body"></div>
    <div id="right-foot">
      <div class="foot-left">
        <span id="save-state">入力は自動保存されます</span>
        <button type="button" class="linkbtn" id="export-btn">ファイルに書き出す</button>
      </div>
      <div class="foot-right">
        <button type="button" class="btn ghost" id="prev">前に戻る</button>
        <button type="button" class="btn hint" id="hint-btn">ヒント</button>
        <button class="btn" id="next">次へ進む</button>
      </div>
    </div>
  </section>
</div>

<!-- ヒント要請の合図（学習用のみ・数秒で自動的に消える） -->
<div id="hint-flash">
  <div class="hint-flash-inner">ヒントを要請しました<span>実験員をお呼びしています</span></div>
</div>

<!-- 理解度テスト（右半分をふさぎ、1問ずつ表示する） -->
<div id="quiz-overlay">
  <div class="quiz-card">
    <h2 id="quiz-title">理解度確認</h2>
    <p class="quiz-lead">
      次の設問に進む前に、以下の問題に答えてください。
      <span id="quiz-count"></span>
    </p>
    <div id="quiz-body"></div>
    <div class="quiz-actions">
      <button class="btn" id="quiz-submit">回答して次へ進む</button>
    </div>
  </div>
</div>

<!-- ===================================================================
     問題データ（data フォルダ）
       catalog.js    … 問題の一覧（トップページのメニュー）
       pN_problem.js … ソースコードと設問
       pN_quiz.js    … 理解度テストの4択問題
     問題を追加するときは、ここに2行足してください。
     =================================================================== -->
<script src="data/catalog.js"></script>
<script src="data/pA_problem.js"></script>
<script src="data/pA_quiz.js"></script>
<script src="data/pB_problem.js"></script>
<script src="data/pB_quiz.js"></script>
<script src="data/pC_problem.js"></script>
<script src="data/pC_quiz.js"></script>
<script src="data/pD_problem.js"></script>
<script src="data/pD_quiz.js"></script>

<script>
/* ===================================================================
   実施する問題とモード
     design_doc.html?problem=pA&mode=learning
       problem … data/catalog.js に登録した問題ID。省略時は pA
       mode    … learning＝学習用（ヒントあり）／test＝検証用
                 指定なし・不正値は検証用として扱う
   =================================================================== */
const params  = new URLSearchParams(location.search);
const MODE    = params.get("mode") === "learning" ? "learning" : "test";
const MODE_LABEL = MODE === "learning" ? "学習用" : "検証用";
const PROBLEM_ID = params.get("problem") || "pA";
const RECORDER_URL = "http://127.0.0.1:8000";

// 問題データを取り出す。読み込めていなければ null（後段でエラー画面を出す）
const PROBLEM = (typeof PROBLEMS !== "undefined" && PROBLEMS) ? PROBLEMS[PROBLEM_ID] : null;
const LOAD_ERROR = !PROBLEM
  ? `問題データを読み込めませんでした（problem=${PROBLEM_ID}）。`
    + ` problem${PROBLEM_ID.replace(/^p/, "")}.js が同じフォルダにあり、`
    + ` design_doc.html から読み込まれているか確認してください。`
  : null;

const ALGORITHM_NAME = PROBLEM ? PROBLEM.name : "";
const SOURCE_CODE    = PROBLEM ? PROBLEM.source : "";
const STEPS          = PROBLEM ? PROBLEM.steps : [];





const QUESTION_COUNT = STEPS.filter(s => s.id).length;
// 問題ごと・モードごとに保存先を分け、入力が混ざらないようにする
const STORAGE_KEY = `design-doc:${PROBLEM_ID}:${MODE}`;

/* ================= 左ペイン：行番号付きで描画し、はみ出さないよう自動縮小 ================= */
function renderCode(){
  const el = document.getElementById("code");
  el.innerHTML = SOURCE_CODE.split("\n").map((line, i) => {
    const esc = line.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return `<span class="ln">${i + 1}</span>${esc}`;
  }).join("\n");
  fitCode();
}
function fitCode(){
  const wrap = document.getElementById("code-wrap");
  const el = document.getElementById("code");
  let size = 16;
  el.style.fontSize = size + "px";
  while (size > 7 &&
        (el.scrollHeight > wrap.clientHeight - 16 || el.scrollWidth > wrap.clientWidth - 8)) {
    size -= 0.5;
    el.style.fontSize = size + "px";
  }
}

/* ===================================================================
   時刻

   3つの形で記録する。
     ISO 文字列   … 人が読んで確認するため
     Unix ミリ秒  … 他の記録（Garmin の CSV、動画、実験ノート）との突き合わせ
     経過ミリ秒   … 解析の主役。「開始する」を押した瞬間を 0 とする

   LSL の時刻（local_clock）は Unix 時刻ではなく起動基準の単調時計なので、
   Unix 時刻では直接対応づけられない。開始時点を基準にした経過時間があれば
       LSL 上の時刻 ≒ 開始マーカーの LSL 時刻 + 経過ミリ秒 / 1000
   で全イベントを LSL の時間軸に載せられる。

   経過時間は performance.now() から求める。Date.now() の差分だと、
   セッション中に時刻補正（NTP）が入ったときに値が飛ぶ。
   =================================================================== */

let startPerf = null;      // 「開始する」を押した時点の performance.now()
let recorderStarted = false;
let recorderStopping = false;

// Unix ミリ秒。Python の time.time() と比べるときは 1000 で割る
function nowUnix(){ return Date.now(); }

// 開始からの経過ミリ秒。まだ開始していなければ null
function elapsedMs(){
  if (startPerf !== null) return Math.round(performance.now() - startPerf);
  // 再読み込み後は performance.now() の基準が失われるため、壁時計で代用する
  if (log && log.startedUnix) return Date.now() - log.startedUnix;
  return null;
}

// ローカル時刻を「2026-08-08T18:43:12+09:00」の形で返す
function nowStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? "+" : "-";
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`
       + `T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
       + `${sign}${p(Math.floor(Math.abs(off)/60))}:${p(Math.abs(off)%60)}`;
}
// 当日の日付を「2026-08-08」の形で返す（実施日の自動入力に使う）
function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fileStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

/* ================= 保存（localStorage への自動保存） ================= */
const store = (() => {
  let raw = null;
  try {
    raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  } catch (e) {
    // 保存データが壊れていても課題は開始できるようにする
    console.error("保存データを読めなかったため、新規として開始します:", e);
    return {};
  }
  // 旧形式（回答だけのフラットな構造）からの移行
  if (raw && !raw.answers && !raw.log) return { answers: raw, log: null };
  return raw || {};
})();
if (!store.answers) store.answers = {};
if (!store.log) store.log = { startedAt:null, finishedAt:null, hints:[] };
if (!store.log.hints) store.log.hints = [];      // 旧データからの移行
if (!store.log.quiz)  store.log.quiz  = [];      // 理解度テストの回答
if (!store.log.quizDone) store.log.quizDone = {}; // 出題済みの設問
if (!store.log.steps) store.log.steps = [];      // 設問ごとの滞在（訪問ごとに1件）

// 前回が途中で閉じられていた場合、開いたままの滞在記録に印をつける
const dangling = store.log.steps[store.log.steps.length - 1];
if (dangling && dangling.終了Unix時刻 === null) dangling.中断 = true;

const answers = store.answers;
const log = store.log;

let saveTimer = null;
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  const s = document.getElementById("save-state");
  s.textContent = "保存しました";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    s.textContent = "入力は自動保存されます";
  }, 1500);
}

function bind(el, key){
  el.value = answers[key] || "";
  el.addEventListener("input", () => {
    answers[key] = el.value;
    if (el.value.trim()) clearMissing(el);
    autoGrow(el);
    save();
  });
  autoGrow(el);
}
function autoGrow(el){
  if (el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight, el.classList.contains("free") ? 120 : 40) + "px";
}

/* ---- 部品 ---- */
function makeBlank(key, width){
  const input = document.createElement("input");
  input.type = "text";
  input.className = "blank";
  if (width) input.style.width = width;
  setTimeout(() => bind(input, key), 0);
  return input;
}
function makeChoices(key, options){
  const box = document.createElement("span");
  box.className = "choices";
  options.forEach(opt => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = key;
    input.value = opt;
    if (answers[key] === opt) input.checked = true;
    input.addEventListener("change", () => { answers[key] = opt; clearMissing(box); save(); });
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt));
    box.appendChild(label);
  });
  return box;
}
function makeArea(key){
  const ta = document.createElement("textarea");
  ta.rows = 1;
  setTimeout(() => bind(ta, key), 0);
  return ta;
}

/* ===================================================================
   設問ごとの滞在記録

   「前に戻る」で同じ設問へ何度も入れるため、訪問ごとに1件を積む。
   合計滞在時間は、同じ設問の記録を足せば求められる。

   終了は「次へ進む」を押した時点で記録する。理解度テストを表示する前に
   閉じるので、設問の滞在時間に4択の回答時間は混ざらない。
   =================================================================== */
function openVisit(stepId){
  log.steps.push({
    設問: stepId,
    訪問: log.steps.filter(v => v.設問 === stepId).length + 1,
    開始時刻: nowStamp(),
    開始Unix時刻: nowUnix(),
    開始経過ミリ秒: elapsedMs(),
    終了時刻: null,
    終了Unix時刻: null,
    終了経過ミリ秒: null,
    滞在ミリ秒: null
  });
}

function closeVisit(){
  const v = log.steps[log.steps.length - 1];
  if (!v || v.終了Unix時刻 !== null) return;      // 開いている記録が無ければ何もしない
  v.終了時刻     = nowStamp();
  v.終了Unix時刻 = nowUnix();
  v.終了経過ミリ秒 = elapsedMs();
  v.滞在ミリ秒 = (v.開始経過ミリ秒 == null || v.終了経過ミリ秒 == null)
    ? v.終了Unix時刻 - v.開始Unix時刻
    : v.終了経過ミリ秒 - v.開始経過ミリ秒;
}

/* ===================================================================
   未入力チェック（学習用・検証用に共通）
   その設問の入力欄がすべて埋まるまで次へ進めない
   =================================================================== */
// 未入力の要素を集める（記述欄・空欄・選択肢）
function findMissing(){
  const body = document.getElementById("right-body");
  const missing = [];

  body.querySelectorAll("textarea, input.blank, input.required-meta").forEach(el => {
    if (!el.value.trim()) missing.push(el);
  });

  // 選択肢はラジオのグループ単位で判定する
  const seen = new Set();
  body.querySelectorAll(".choices").forEach(box => {
    const radios = box.querySelectorAll("input[type=radio]");
    if (!radios.length || seen.has(radios[0].name)) return;
    seen.add(radios[0].name);
    if (![...radios].some(r => r.checked)) missing.push(box);
  });

  // 画面に並んでいる順に返す
  return missing.sort((a, b) =>
    (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
}

// 「ここが空欄」の表示を付ける
function markMissing(el){
  if (el.classList.contains("missing")) return;
  el.classList.add("missing");
  const tag = document.createElement("span");
  tag.className = "missing-tag";
  tag.textContent = "未入力";
  el.insertAdjacentElement("afterend", tag);
}
// 入力されたら、その欄の表示を消す
function clearMissing(el){
  if (!el.classList.contains("missing")) return;
  el.classList.remove("missing");
  const tag = el.nextElementSibling;
  if (tag && tag.classList.contains("missing-tag")) tag.remove();
  refreshMissingMsg();
}

// 画面上部の案内を出す・更新する・消す
function refreshMissingMsg(count){
  const body = document.getElementById("right-body");
  const left = (count !== undefined) ? count : body.querySelectorAll(".missing").length;
  let msg = document.getElementById("validation-msg");

  if (!left){ if (msg) msg.remove(); return; }

  if (!msg){
    msg = document.createElement("div");
    msg.id = "validation-msg";
    body.insertBefore(msg, body.firstChild);
  }
  const btn = document.getElementById("next").textContent;   // 「次へ進む」「開始する」など
  msg.textContent =
    `未入力の欄が ${left} か所あります。「未入力」と示した欄をすべて埋めてから「${btn}」を押してください。`;

  // 設問では、どうしても分からないときの進み方を案内する
  // （「はじめに」画面の被験者IDには当てはまらないので出さない）
  const step = STEPS[current];
  if (step && step.id){
    const sub = document.createElement("span");
    sub.className = "msg-sub";
    sub.textContent = "ヒントをもらっても分からない場合は、その欄に \\ を入れて進んでください。";
    msg.appendChild(sub);
  }
}

/* ===================================================================
   理解度テスト
   設問を終えて次へ進む直前に、画面全体をふさいで出題する
   問題データは同じフォルダの quizN.js（QUIZZES）から読み込む
   =================================================================== */
// quizN.js が読み込まれていればその内容を使う（読めなければ出題しない）
const QUIZ = (typeof QUIZZES !== "undefined" && QUIZZES && QUIZZES[PROBLEM_ID]) || {};
if (PROBLEM && !Object.keys(QUIZ).length){
  console.error(`理解度テストの問題データ（QUIZZES["${PROBLEM_ID}"]）を読み込めませんでした。`);
}
// 出題済みの印。再読み込みされても二重に出題・記録しないよう保存に残す
const quizDone = log.quizDone;
let quizContext = null;       // { stepId, shownAt }

function hasQuiz(stepId){
  return Array.isArray(QUIZ[stepId]) && QUIZ[stepId].length > 0 && !quizDone[stepId];
}

// 理解度テストを開く。1問ずつ表示し、問ごとに開始と終了の時刻を記録する
function openQuiz(stepId){
  quizContext = { stepId, index: 0 };
  document.getElementById("quiz-overlay").classList.add("on");
  // 隠れている設計書へ Tab キーで入り込めないようにする
  document.getElementById("right").inert = true;
  renderQuizItem();
}

// いま表示すべき1問を描画し、その表示時刻を開始時刻として押さえる
function renderQuizItem(){
  const items = QUIZ[quizContext.stepId];
  const i     = quizContext.index;
  const item  = items[i];
  const body  = document.getElementById("quiz-body");

  body.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "quiz-item";

  const q = document.createElement("p");
  q.className = "quiz-q";
  q.innerHTML = `<span class="no">問${i + 1}</span>`;
  q.appendChild(document.createTextNode(item.question || ""));
  wrap.appendChild(q);

  const box = document.createElement("div");
  box.className = "quiz-choices";
  (item.choices || []).forEach((choice, ci) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = `quiz.${quizContext.stepId}.${item.id || i}`;
    input.value = String(ci);
    input.addEventListener("change", () => {
      wrap.classList.remove("missing");
      const msg = document.getElementById("quiz-msg");
      if (msg) msg.remove();
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(`${ci + 1}. ${choice}`));
    box.appendChild(label);
  });
  wrap.appendChild(box);
  body.appendChild(wrap);

  // この問の開始時刻。表示した瞬間を指す
  quizContext.shownAt      = nowStamp();
  quizContext.shownUnix    = nowUnix();
  quizContext.shownElapsed = elapsedMs();

  document.getElementById("quiz-count").textContent = `${i + 1} / ${items.length} 問`;
  document.getElementById("quiz-submit").textContent =
    (i === items.length - 1) ? "回答して次へ進む" : "次の問題へ";
  body.scrollTop = 0;
}

// 「回答して次へ進む」：全問答えていなければ閉じない
// 表示中の1問を確定する。全問終わったら閉じて次の設問へ進む
function submitQuiz(){
  const items = QUIZ[quizContext.stepId];
  const i     = quizContext.index;
  const item  = items[i];
  const wrap  = document.querySelector("#quiz-body .quiz-item");
  const chosen = wrap.querySelector("input:checked");

  if (!chosen){
    wrap.classList.add("missing");
    let msg = document.getElementById("quiz-msg");
    if (!msg){
      msg = document.createElement("div");
      msg.id = "quiz-msg";
      document.getElementById("quiz-body").insertAdjacentElement("beforebegin", msg);
    }
    msg.textContent = "選択肢をひとつ選んでから押してください。";
    return;
  }

  // この問の終了時刻。開始との差がその問の反応時間になる
  const answeredAt      = nowStamp();
  const answeredUnix    = nowUnix();
  const answeredElapsed = elapsedMs();

  const picked  = Number(chosen.value);
  const correct = (item.answer === null || item.answer === undefined)
    ? "" : (picked === item.answer ? "正解" : "不正解");

  log.quiz.push({
    直前の設問: quizContext.stepId,
    出題順: i + 1,
    問題ID: item.id || `${quizContext.stepId}-${i + 1}`,
    問題: item.question || "",
    選択番号: picked + 1,
    選択した選択肢: (item.choices || [])[picked] || "",
    正解番号: (item.answer === null || item.answer === undefined) ? "" : item.answer + 1,
    正誤: correct,
    開始時刻: quizContext.shownAt,
    開始Unix時刻: quizContext.shownUnix,
    開始経過ミリ秒: quizContext.shownElapsed,
    終了時刻: answeredAt,
    終了Unix時刻: answeredUnix,
    終了経過ミリ秒: answeredElapsed,
    反応時間ミリ秒: (quizContext.shownElapsed == null || answeredElapsed == null)
      ? answeredUnix - quizContext.shownUnix
      : answeredElapsed - quizContext.shownElapsed
  });

  const msg = document.getElementById("quiz-msg");
  if (msg) msg.remove();

  // まだ問題が残っていれば次の1問へ。前の問題には戻らない
  if (i + 1 < items.length){
    quizContext.index = i + 1;
    save();
    renderQuizItem();
    return;
  }

  quizDone[quizContext.stepId] = true;
  document.getElementById("quiz-overlay").classList.remove("on");
  document.getElementById("right").inert = false;
  quizContext = null;
  save();
  advance();
}

  }, 0);

  return frag;
}

async function recorderRequest(action, query = {}){
  const url = new URL(`${RECORDER_URL}/${action}`);
  Object.entries(query).forEach(([key, value]) => url.searchParams.set(key, value));
  const response = await fetch(url.toString());
  let body = {};
  try { body = await response.json(); } catch (e) {}
  if (!response.ok) throw new Error(body.error || `記録サーバーエラー (${response.status})`);
  return body;
}

async function startRecorder(){
  const button = document.getElementById("recorder-start");
  const status = document.getElementById("recorder-status");
  const subjectId = (document.getElementById("subject-id").value || "").trim();
  if (!subjectId){
    status.className = "recorder-status error";
    status.textContent = "被験者IDを入力してください。";
    document.getElementById("subject-id").focus();
    return;
  }

  button.disabled = true;
  status.className = "recorder-status";
  status.textContent = "デバイスを確認して記録を開始しています…";
  try {
    const result = await recorderRequest("start", {subject_id: subjectId, problem_id: PROBLEM_ID});
    recorderStarted = true;
    button.textContent = "記録中";
    const missing = result.missing_devices || [];
    status.className = `recorder-status ${missing.length ? "warn" : "ok"}`;
    status.textContent = missing.length
      ? `記録を開始しました。不足デバイス：${missing.join("、")}`
      : "すべてのデバイスを確認し、記録を開始しました。";
  } catch (e) {
    button.disabled = false;
    status.className = "recorder-status error";
    status.textContent = `記録を開始できません：${e.message}`;
  }
}

async function stopRecorder(){
  if (MODE !== "learning" || !recorderStarted || recorderStopping) return;
  recorderStopping = true;
  try {
    await recorderRequest("end");
    recorderStarted = false;
  } catch (e) {
    console.error("記録を終了できませんでした:", e);
    alert(`LSL記録を終了できませんでした。実験員にお知らせください。\n${e.message}`);
  } finally {
    recorderStopping = false;
  }
}

function renderBlock(step, b, bi){
  const base = `${step.id}.b${bi}`;

  if (b.type === "subhead"){
    const h = document.createElement("h3");
    h.className = "q-sub";
    h.textContent = b.text;
    return h;
  }

  if (b.type === "note"){
    const p = document.createElement("p");
    p.className = "q-note";
    p.textContent = b.text;
    return p;
  }

  if (b.type === "text"){
    const ta = document.createElement("textarea");
    ta.className = "free";
    setTimeout(() => bind(ta, `${base}.${b.key}`), 0);
    return ta;
  }

  if (b.type === "scale"){
    const wrap = document.createElement("div");
    const legend = document.createElement("p");
    legend.className = "scale-legend";
    legend.textContent =
      "1：ほとんど理解できなかった　2：一部のみ　3：おおむね　4：ほぼ　5：十分に理解できた";
    const box = document.createElement("div");
    box.className = "scale";
    box.appendChild(makeChoices(`${base}.${b.key}`, ["1","2","3","4","5"]));
    wrap.appendChild(legend);
    wrap.appendChild(box);
    return wrap;
  }

  if (b.type === "fill"){
    const p = document.createElement("p");
    p.className = "fill";
    if (b.lead){
      const lead = document.createElement("span");
      lead.className = "lead";
      lead.textContent = b.lead;
      p.appendChild(lead);
    }
    b.parts.forEach((part, pi) => {
      if (typeof part === "string"){
        p.appendChild(document.createTextNode(part));
      } else if (part.c){
        p.appendChild(makeChoices(`${base}.${part.key || "c" + pi}`, part.c));
      } else {
        p.appendChild(makeBlank(`${base}.${part.b}`, part.w));
      }
    });
    return p;
  }

  /* ---- grid ---- */
  const table = document.createElement("table");

  if (b.widths){
    const cg = document.createElement("colgroup");
    b.widths.forEach(w => {
      const col = document.createElement("col");
      col.style.width = w;
      cg.appendChild(col);
    });
    table.appendChild(cg);
  }

  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  b.headers.forEach(hh => {
    const th = document.createElement("th");
    th.textContent = hh;
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  b.rows.forEach((row, ri) => {
    const tr = document.createElement("tr");
    if (row.example) tr.className = "example";

    row.cells.forEach((cell, ci) => {
      const td = document.createElement("td");
      const key = `${base}.r${ri}.c${ci}`;

      if (typeof cell === "string"){
        // 固定表示セル
        td.className = row.example ? "" : (ci === 0 ? "label" : "label center");
        td.textContent = cell;
      } else if (cell === null){
        // 記述欄
        td.className = "cell";
        td.appendChild(makeArea(key));
      } else if (cell.choice){
        // 選択肢
        td.className = "cell";
        const w = document.createElement("div");
        w.className = "cellwrap";
        w.appendChild(makeChoices(key, cell.choice));
        td.appendChild(w);
      } else {
        // 前後の文字つき空欄　例：prime[ ___ ]
        td.className = "cell";
        const w = document.createElement("div");
        w.className = "cellwrap";
        if (cell.pre){
          const s = document.createElement("span");
          s.className = "fixed";
          s.textContent = cell.pre;
          w.appendChild(s);
        }
        w.appendChild(makeBlank(key, cell.w));
        if (cell.suf){
          const s = document.createElement("span");
          s.className = "fixed";
          s.textContent = cell.suf;
          w.appendChild(s);
        }
        td.appendChild(w);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

/* ===================================================================
   書き出し用インデックス
   STEPS を走査して「入力欄のキー → どの設問のどの項目か」の一覧を作る。
   未回答の欄も含めて全項目が並ぶので、被験者間で列が揃う。
   =================================================================== */
function buildFieldIndex(){
  const list = [];
  list.push({stepId:"meta", stepTitle:"表紙", section:"", item:"被験者ID",  blankNo:"", key:"meta.subjectId"});
  list.push({stepId:"meta", stepTitle:"表紙", section:"", item:"実施日",    blankNo:"", key:"meta.date"});

  STEPS.forEach(step => {
    if (!step.id) return;
    let section = "";

    step.blocks.forEach((b, bi) => {
      const base = `${step.id}.b${bi}`;

      if (b.type === "subhead"){ section = b.text; return; }
      if (b.type === "note") return;

      if (b.type === "text"){
        list.push({stepId:step.id, stepTitle:step.title, section, item:"自由記述", blankNo:"", key:`${base}.${b.key}`});
        return;
      }
      if (b.type === "scale"){
        list.push({stepId:step.id, stepTitle:step.title, section, item:"理解度（1〜5）", blankNo:"", key:`${base}.${b.key}`});
        return;
      }
      if (b.type === "fill"){
        // 文章全体を項目名にし、空欄には通し番号を振る
        const sentence = (b.lead || "") + b.parts.map(p =>
          typeof p === "string" ? p : (p.c ? `〔${p.c.join("・")}〕` : "＿＿")
        ).join("");
        let n = 0;
        b.parts.forEach((p, pi) => {
          if (typeof p === "string") return;
          n++;
          const key = p.c ? `${base}.${p.key || "c" + pi}` : `${base}.${p.b}`;
          list.push({stepId:step.id, stepTitle:step.title, section, item:sentence, blankNo:n, key});
        });
        return;
      }

      // grid
      b.rows.forEach((row, ri) => {
        if (row.example) return;                       // 記入例の行は対象外
        // 固定表示のセルから行名を作る（複数あるときは「見出し=値」の形にする）
        const fixed = row.cells
          .map((c, ci) => typeof c === "string" ? {h: b.headers[ci] || "", v: c} : null)
          .filter(Boolean);
        const rowLabel = fixed.length === 1
          ? fixed[0].v
          : fixed.map(x => `${x.h}=${x.v}`).join(" ");
        row.cells.forEach((cell, ci) => {
          if (typeof cell === "string") return;        // 固定表示セル
          const header = b.headers[ci] || "";
          const item = rowLabel ? `${rowLabel} / ${header}` : header;
          list.push({stepId:step.id, stepTitle:step.title, section, item, blankNo:"", key:`${base}.r${ri}.c${ci}`});
        });
      });
    });
  });
  return list;
}

/* ================= ファイル書き出し ================= */
function baseName(){
  const id = (answers["meta.subjectId"] || "noID").replace(/[^\w\-一-龠ぁ-んァ-ヶ]/g, "_");
  return `design_${PROBLEM_ID}_${MODE}_${id}_${fileStamp()}`;
}
function download(filename, mime, text){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csv(rows){
  const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  // Excel で文字化けしないよう BOM を付ける
  return "﻿" + rows.map(r => r.map(esc).join(",")).join("\r\n");
}

// 同じ設問への複数回の訪問をまとめる（解析でよく使う形にしておく）
function 設問別合計(){
  const order = [];
  const sum = {};
  log.steps.forEach(v => {
    if (!(v.設問 in sum)){ order.push(v.設問); sum[v.設問] = { 訪問回数: 0, 合計滞在ミリ秒: 0 }; }
    sum[v.設問].訪問回数++;
    if (v.滞在ミリ秒 != null) sum[v.設問].合計滞在ミリ秒 += v.滞在ミリ秒;
  });
  return order.map(id => Object.assign({ 設問: id }, sum[id]));
}

// 書き出す情報：モード・アルゴリズム名・被験者ID・実施日・各時刻
//               ヒント要請回数・最終的な回答
// 時刻は ISO 文字列（確認用）・Unix ミリ秒（他の記録との突き合わせ用）・
// 経過ミリ秒（解析用。開始を 0 とする）の3種類を記録する
function header(){
  return {
    問題ID: PROBLEM_ID,
    モード: MODE_LABEL,
    アルゴリズム: ALGORITHM_NAME,
    被験者ID: answers["meta.subjectId"] || "",
    実施日: answers["meta.date"] || "",
    開始時刻: log.startedAt || "",
    開始Unix時刻: log.startedUnix || "",
    回答終了時刻: log.finishedAt || "",
    回答終了Unix時刻: log.finishedUnix || "",
    所要ミリ秒: (log.finishedElapsedMs == null) ? "" : log.finishedElapsedMs,
    ヒント要請回数: log.hints.length,
    理解度テスト正解数: log.quiz.filter(q => q.正誤 === "正解").length,
    理解度テスト出題数: log.quiz.length
  };
}

function downloadJSON(){
  const payload = Object.assign(header(), {
    設問滞在: log.steps,
    設問別合計: 設問別合計(),
    ヒント要請: log.hints,
    理解度テスト: log.quiz,
    回答: buildFieldIndex()
      .filter(f => f.stepId !== "meta")
      .map(f => ({
        設問: f.stepId, 区分: f.section, 項目: f.item, 空欄: f.blankNo,
        回答: answers[f.key] || "", キー: f.key
      }))
  });
  download(baseName() + ".json", "application/json", JSON.stringify(payload, null, 2));
}

// どのファイルにも入れる結合キー。問題ID・条件・被験者ID で3ファイルを突き合わせる
function keyColumns(){
  const h = header();
  return {
    header: ["問題ID","アルゴリズム","条件","被験者ID","実施日"],
    values: [h.問題ID, h.アルゴリズム, h.モード, h.被験者ID, h.実施日]
  };
}

/* 回答（採点用）。1行1項目。時刻はイベント側と JSON にあるので載せない */
function downloadAnswersCSV(){
  const k = keyColumns();
  const rows = [k.header.concat(["設問","区分","項目","空欄","回答"])];

  buildFieldIndex()
    .filter(f => f.stepId !== "meta")
    .forEach(f => {
      rows.push(k.values.concat([f.stepId, f.section, f.item, f.blankNo, answers[f.key] || ""]));
    });

  download(baseName() + "_answers.csv", "text/csv", csv(rows));
}

/* イベント（機械学習用）。1行1イベント。種別で行を選べばそのまま解析に使える */
function downloadEventsCSV(){
  const k = keyColumns();
  const h = header();
  const rows = [k.header.concat([
    "種別","対象","連番",
    "開始時刻","開始Unix時刻","開始経過ミリ秒",
    "終了時刻","終了Unix時刻","終了経過ミリ秒",
    "所要ミリ秒","補足"
  ])];
  const add = (...cols) => rows.push(k.values.concat(cols));

  // 課題全体
  add("セッション", "課題全体", "",
      h.開始時刻, h.開始Unix時刻, 0,
      h.回答終了時刻, h.回答終了Unix時刻, h.所要ミリ秒,
      h.所要ミリ秒, "");

  // 設問ごとの滞在。「前に戻る」で複数回入れるため訪問ごとに1行
  log.steps.forEach(v => {
    add("設問滞在", v.設問, v.訪問,
        v.開始時刻, v.開始Unix時刻, v.開始経過ミリ秒,
        v.終了時刻 || "", v.終了Unix時刻 || "", v.終了経過ミリ秒 == null ? "" : v.終了経過ミリ秒,
        v.滞在ミリ秒 == null ? "" : v.滞在ミリ秒,
        v.中断 ? "中断" : "");
  });

  // ヒント要請（学習用のみ）。押した瞬間の1点なので開始と終了が同じ
  log.hints.forEach(x => {
    add("ヒント要請", x.設問, x.通番,
        x.時刻, x.Unix時刻, x.経過ミリ秒 == null ? "" : x.経過ミリ秒,
        x.時刻, x.Unix時刻, x.経過ミリ秒 == null ? "" : x.経過ミリ秒,
        "", "");
  });

  // 理解度テスト。所要は反応時間
  log.quiz.forEach(x => {
    add("理解度テスト", x.直前の設問, x.出題順,
        x.開始時刻, x.開始Unix時刻, x.開始経過ミリ秒,
        x.終了時刻, x.終了Unix時刻, x.終了経過ミリ秒,
        x.反応時間ミリ秒 == null ? "" : x.反応時間ミリ秒,
        `${x.問題ID}／選択${x.選択番号}／正解${x.正解番号}／${x.正誤}`);
  });

  download(baseName() + "_events.csv", "text/csv", csv(rows));
}

function exportAll(){
  downloadJSON();
  setTimeout(downloadAnswersCSV, 500);
  setTimeout(downloadEventsCSV, 1000);
}

document.getElementById("export-btn").addEventListener("click", exportAll);
document.getElementById("hint-btn").addEventListener("click", requestHint);

/* ================= 遷移 ================= */
document.getElementById("next").addEventListener("click", () => {
  if (current >= STEPS.length - 1) return;

  // 学習用は生体信号を収録してから課題を始める。
  // デバイス不足は記録サーバー側で警告付きの成功になるため、ここでは妨げない。
  if (MODE === "learning" && STEPS[current].kind === "intro" && !recorderStarted){
    const status = document.getElementById("recorder-status");
    if (status){
      status.className = "recorder-status error";
      status.textContent = "先に「記録開始」を押してください。";
      status.scrollIntoView({behavior:"smooth", block:"center"});
    }
    return;
  }

  // すべて埋まるまで次へ進めない（「はじめに」の被験者IDも対象）
  const missing = findMissing();
  if (missing.length){
    missing.forEach(markMissing);
    refreshMissingMsg(missing.length);
    missing[0].scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  // 理解度テストを出す前に設問の滞在を閉じる。
  // 逆にすると、設問の滞在時間に4択の回答時間が混ざってしまう
  const step = STEPS[current];
  if (step.id) closeVisit();

  // 設問を終えた直後に理解度テストがあれば、先にそれを出す
  if (step.id && hasQuiz(step.id)){
    openQuiz(step.id);
    return;
  }

  advance();
});

// 次のステップへ進む（理解度テストの回答後もここに戻ってくる）
function advance(){
  // 「開始する」を押した時刻を記録する。ここが経過時間の 0 点になる
  if (STEPS[current].kind === "intro"){
    // 途中で再読み込みされても最初の時刻を保つため、すでにあれば上書きしない
    if (!log.startedAt){
      log.startedAt   = nowStamp();
      log.startedUnix = nowUnix();
    }
    startPerf = performance.now();
  }

  current++;
  if (STEPS[current].kind === "done"){
    log.finishedAt        = nowStamp();
    log.finishedUnix      = nowUnix();
    log.finishedElapsedMs = elapsedMs();
    stopRecorder();
  }

  save();
  render();
}

document.getElementById("quiz-submit").addEventListener("click", submitQuiz);

// 前の設問へ戻る。未入力チェックはかけない（進むのではなく離れる操作なので）
document.getElementById("prev").addEventListener("click", () => {
  if (current < 2) return;              // 「はじめに」までは戻さない
  closeVisit();
  current--;
  save();
  render();
});

window.addEventListener("resize", fitCode);

if (LOAD_ERROR){
  // 問題データが無いまま実験を進めさせない
  document.getElementById("right-body").innerHTML =
    '<div id="validation-msg"></div>' +
    '<p class="q-desc">トップページ（index.html）から選び直してください。</p>';
  document.querySelector("#validation-msg").textContent = LOAD_ERROR;
  document.getElementById("right-foot").style.display = "none";
  document.getElementById("code-mask").textContent = "問題データを読み込めませんでした";
  console.error(LOAD_ERROR);
} else {
  renderCode();
  render();
  save();
}
